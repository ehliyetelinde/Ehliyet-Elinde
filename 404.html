<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sayfa Bulunamadı - Ehliyet Elinde</title>
  <link rel="icon" type="image/x-icon" href="/Ehliyet-Elinde/favicon.ico">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b0f19;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      max-width: 480px;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 24px;
      padding: 40px 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 64px;
      margin: 0;
      color: #3b82f6;
      font-weight: 900;
    }
    h2 {
      font-size: 22px;
      margin: 12px 0 8px 0;
    }
    p {
      color: #9ca3af;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn-group {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #2563eb;
      color: #fff;
    }
    .btn-primary:hover {
      background: #1d4ed8;
      transform: translateY(-2px);
    }
    .btn-secondary {
      background: #1f2937;
      color: #e5e7eb;
      border: 1px solid #374151;
    }
    .btn-secondary:hover {
      background: #374151;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>404</h1>
    <h2>Aradığınız Sayfa Bulunamadı</h2>
    <p>Ulaşmak istediğiniz sayfa taşınmış veya kaldırılmış olabilir. Ana sayfaya dönebilir veya doğrudan sınav uygulamasını açabilirsiniz.</p>
    <div class="btn-group">
      <a href="/Ehliyet-Elinde/" class="btn btn-secondary">Tanıtım Sayfası</a>
      <a href="/Ehliyet-Elinde/app/" class="btn btn-primary">Uygulamayı Aç</a>
    </div>
  </div>
</body>
</html>
